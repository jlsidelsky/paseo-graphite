<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; --fg: light-dark(#1f1f1f, #e8e8e8); --muted: light-dark(#6b6b6b, #9a9a9a); --bg: light-dark(#f7f7f5, #1c1c1c); --card: light-dark(#fff, #262626); --border: light-dark(#e2e2de, #3a3a3a); --accent: #d97757; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.45 -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    header select { flex: 1; min-width: 0; }
    select, button, textarea { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
    button { cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #pin-btn { filter: grayscale(1); opacity: .6; }
    #pin-btn[aria-pressed="true"] { filter: none; opacity: 1; border-color: var(--accent); }
    #settings { display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--card); font-size: 12px; }
    #settings[hidden] { display: none; }
    #settings label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #settings input { accent-color: var(--accent); margin: 0; }
    #actions { display: flex; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--border); position: relative; }
    #actions[hidden] { display: none; }
    #actions > button { font-size: 12px; padding: 2px 8px; }
    #menu { position: absolute; top: 100%; margin-top: 2px; z-index: 2; min-width: 220px; max-width: calc(100% - 20px); max-height: 60vh; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25); padding: 4px; display: flex; flex-direction: column; }
    #menu[hidden] { display: none; }
    #menu h4 { margin: 6px 6px 2px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .menu-item { border: 0; background: none; text-align: left; display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 5px; }
    .menu-item:hover, .menu-item:focus-visible { background: color-mix(in srgb, var(--accent) 18%, transparent); }
    .menu-item b { font-weight: 500; white-space: nowrap; }
    .menu-item span { color: var(--muted); font-size: 12px; margin-left: auto; }
    .menu-link { border: 0; background: none; color: var(--accent); padding: 2px 6px; font-size: 12px; text-align: left; }
    .menu-note { color: var(--muted); padding: 4px 6px; font-size: 12px; }
    #actions .sep { width: 1px; background: var(--border); margin: 2px 0; }
    #scope-btn:disabled { opacity: .7; }
    .scope { display: flex; flex-direction: column; gap: 1px; padding-top: 2px; border-top: 1px solid var(--border); margin-top: 2px; }
    .scope .primary { align-self: flex-end; margin: 4px 6px 2px; font-size: 12px; background: var(--accent); border-color: var(--accent); color: #fff; }
    .scope label { display: flex; gap: 6px; align-items: center; padding: 1px 6px; font-size: 12px; cursor: pointer; }
    .scope label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scope input { accent-color: var(--accent); margin: 0; flex: none; }
    #settings .menu-link { padding: 0; }
    #status { padding: 4px 10px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
    #status a { color: var(--accent); }
    #timeline { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { white-space: pre-wrap; word-wrap: break-word; }
    .md { white-space: normal; }
    .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
    .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 8px; }
    .md ul, .md ol { padding-left: 20px; }
    .md h1, .md h2, .md h3, .md h4 { font-size: 13px; margin: 12px 0 6px; }
    .md code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 0 3px; }
    .md pre { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 8px; overflow-x: auto; }
    .md pre code { border: 0; padding: 0; background: none; }
    .md table { border-collapse: collapse; display: block; overflow-x: auto; }
    .md th, .md td { border: 1px solid var(--border); padding: 3px 6px; text-align: left; }
    .md blockquote { border-left: 3px solid var(--border); padding-left: 8px; color: var(--muted); }
    .md a { color: var(--accent); }
    .user { align-self: flex-end; max-width: 85%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; }
    .tool, .reasoning { color: var(--muted); font-size: 12px; }
    .tool summary, .reasoning summary { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tool pre { white-space: pre-wrap; margin: 4px 0 0; max-height: 240px; overflow: auto; }
    .error { color: #d33; }
    .tool > pre { font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
    .tool > pre.error { color: #d33; }
    .tool .cmd-line { font-weight: 600; }
    .tool.failed summary { color: #d33; }
    .tool.canceled summary { text-decoration: line-through; }
    .diff span { display: block; }
    .diff .da { background: color-mix(in srgb, #2da44e 18%, transparent); color: light-dark(#116329, #7ee2a0); }
    .diff .dr { background: color-mix(in srgb, #cf222e 16%, transparent); color: light-dark(#82071e, #ffa198); }
    .diff .dh { color: var(--muted); }
    #stop-btn { display: none; }
    #session-mode { flex: 0 1 auto; max-width: 55%; }
    body.creating #session-mode, body.creating #context { display: none; }
    #context { color: var(--muted); font-size: 12px; white-space: nowrap; }
    #context.high { color: #d98a00; } #context.full { color: #d33; }
    body.busy:not(.creating) #stop-btn { display: inline-block; }
    .user-wrap { align-self: flex-end; display: flex; align-items: center; gap: 4px; max-width: 85%; }
    .user-wrap .user { max-width: none; }
    .rewind-btn { visibility: hidden; border: 0; background: none; color: var(--muted); padding: 2px 4px; }
    .user-wrap:hover .rewind-btn, .rewind-btn:focus-visible { visibility: visible; }
    .rewind-menu { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); align-items: center; }
    .permission { border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; background: var(--card); }
    .permission pre { white-space: pre-wrap; margin: 0; max-height: 200px; overflow: auto; font-size: 12px; }
    .permission .row { justify-content: flex-end; flex-wrap: wrap; }
    .permission button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .permission button.danger { color: #d33; }
    .permission > .md { max-height: 320px; overflow: auto; }
    .questions { display: flex; flex-direction: column; gap: 10px; }
    .questions fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .questions legend { padding: 0; margin-bottom: 4px; }
    .questions legend small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .questions legend span { font-weight: 600; }
    .questions label { display: flex; gap: 8px; align-items: flex-start; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
    .questions label:hover, .questions label:has(:checked) { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .questions label input { accent-color: var(--accent); margin: 3px 0 0; flex: none; }
    .questions label small { display: block; color: var(--muted); font-size: 12px; }
    .questions input[type=text] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; margin-top: 2px; }
    .questions input[type=text]:focus { outline: none; border-color: var(--accent); }
    .working { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .dots { display: inline-flex; gap: 3px; }
    .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite ease-in-out; }
    .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .7; } }
    .overview { display: flex; flex-direction: column; gap: 4px; }
    .overview h4 { margin: 8px 0 2px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .overview h4:first-child { margin-top: 0; }
    .session-row { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 1px; }
    .session-row b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .session-row span { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); margin: auto; text-align: center; padding: 20px; }
    footer { padding: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; position: relative; }
    #suggest { position: absolute; left: 10px; right: 10px; bottom: 100%; margin-bottom: 4px; max-height: 260px; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25); padding: 4px; z-index: 1; }
    #suggest[hidden] { display: none; }
    .cmd { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 5px; cursor: pointer; }
    .cmd.active { background: color-mix(in srgb, var(--accent) 18%, transparent); }
    .cmd b { font-weight: 600; white-space: nowrap; }
    .cmd span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #attachments { display: flex; flex-wrap: wrap; gap: 6px; }
    #attachments[hidden] { display: none; }
    .thumb { position: relative; }
    .thumb img { display: block; width: 52px; height: 52px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
    .thumb button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0; border-radius: 50%; line-height: 1; font-size: 12px; }
    body.archived #attachments { display: none; }
    textarea { width: 100%; resize: vertical; min-height: 64px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row select { flex: 1; min-width: 0; }
    #new-form { display: none; }
    body.creating #new-form { display: flex; }
    body.creating #agent-select { display: none; }
    #archived { display: none; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); }
    body.archived #archived { display: flex; }
    body.archived #prompt, body.archived #send-row { display: none; }
  </style>
</head>
<body>
  <header>
    <select id="agent-select"></select>
    <button id="new-btn" title="New session">＋ New</button>
    <button id="pin-btn" title="Pin: keep showing these sessions when you switch tabs" aria-pressed="false">📌</button>
    <button id="settings-btn" title="Settings">⚙</button>
  </header>
  <div id="settings" hidden>
    <label><input type="checkbox" name="notify" /> Notify when a session finishes or needs you</label>
    <label><input type="checkbox" name="markTab" /> Mark the tab</label>
    <button id="customize-btn" class="menu-link">Customize prompts…</button>
  </div>
  <div id="actions" hidden>
    <button id="scope-btn">This PR ▾</button>
    <span class="sep"></span>
    <button id="review-btn" title="Review this PR or its stack">Review ▾</button>
    <button id="fix-ci-btn">Fix CI</button>
    <button id="feedback-btn" title="Evaluate or address review feedback">Feedback ▾</button>
    <div id="menu" hidden></div>
  </div>
  <div id="status"><span id="status-text">Connecting…</span><a id="go-to" href="#" hidden></a><a id="open-in-paseo" href="#" hidden>Open in Paseo</a></div>
  <div id="timeline"></div>
  <footer>
    <div id="suggest" hidden></div>
    <div id="new-form" class="row" style="flex-direction: column; align-items: stretch;">
      <select id="workspace-select"></select>
      <div class="row"><select id="model-select"></select><select id="effort-select"></select><select id="mode-select" title="Permission mode"></select></div>
    </div>
    <div id="archived"><span>This session is archived</span><button id="unarchive-btn">Unarchive</button></div>
    <div id="attachments" hidden></div>
    <textarea id="prompt" placeholder="Message this session (⇧↩ for a new line)"></textarea>
    <div id="send-row" class="row" style="justify-content: flex-end;"><select id="session-mode" title="Permission mode" hidden></select><span id="context" hidden></span><span style="flex: 1"></span><button id="stop-btn" title="Interrupt the session">Stop</button><button id="send-btn">Send</button></div>
  </footer>
  <script type="module" src="panel.js"></script>
</body>
</html>
